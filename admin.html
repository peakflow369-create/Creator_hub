<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCH - Admin Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #080c14;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

  <div class="max-w-3xl mx-auto">
    <header class="mb-6 flex justify-between items-center border-b border-slate-800 pb-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center font-bold text-amber-400">ADM</div>
        <div>
          <h1 class="text-xl font-black text-amber-400 tracking-wide">ADMIN CONTROL PANEL</h1>
          <p class="text-xs text-slate-400">@peakflowio • Asset Manager</p>
        </div>
      </div>
      <span id="dbStatus" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs px-3 py-1 rounded-full font-mono font-bold">
        Connecting...
      </span>
    </header>

    <section class="bg-slate-900 border border-slate-800 p-5 rounded-2xl mb-8 shadow-xl">
      <h2 class="text-base font-bold text-white mb-4 flex items-center gap-2">
        <span>➕</span> Add New Asset to Vault
      </h2>

      <form id="uploadForm" onsubmit="handleAssetUpload(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Asset Title</label>
          <input type="text" id="assetTitle" required placeholder="e.g. Cinematic Riser Whoosh #01" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-400">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Category</label>
            <select id="assetCategory" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-400">
              <option value="SFX Packs">SFX Packs</option>
              <option value="Overlays">Overlays</option>
              <option value="LUTs">LUTs</option>
              <option value="Presets">Presets</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">File Size</label>
            <input type="text" id="assetSize" required placeholder="e.g. 12.4 MB or 4K ProRes" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-400">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Direct Download URL / Drive Link</label>
          <input type="url" id="assetUrl" required placeholder="https://drive.google.com/file/d/..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-400">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-lg">
          Publish Asset to Database 🚀
        </button>
      </form>
    </section>

    <section>
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <span>📦</span> Live Vault Inventory
        </h2>
        <button onclick="fetchAssets()" class="text-xs text-amber-400 hover:underline">Refresh List</button>
      </div>

      <div id="inventoryContainer" class="space-y-3">
        <p class="text-xs text-slate-500 text-center py-8">Loading inventory...</p>
      </div>
    </section>
  </div>

  <script>
    const SUPABASE_URL = 'https://bukpvrphgjoqrffwlwys.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FB93AZKw6tW8tVJpPlD3eA_8ygbt67J';

    async function fetchAssets() {
      const container = document.getElementById('inventoryContainer');
      const statusBadge = document.getElementById('dbStatus');
      
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/assets?select=*&order=created_at.desc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
          }
        });

        if (!res.ok) throw new Error('Database response failed');
        
        const items = await res.json();
        statusBadge.innerText = 'Connected 🟢';
        statusBadge.className = 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1 rounded-full font-mono font-bold';

        if (items.length === 0) {
          container.innerHTML = `
            <div class="text-center py-8 bg-slate-900/50 rounded-xl border border-dashed border-slate-800">
              <p class="text-xs text-slate-400">No assets published yet.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = '';
        items.forEach(item => {
          container.innerHTML += `
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center justify-between gap-4">
              <div class="truncate">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-[10px] bg-slate-800 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded font-mono">${item.category}</span>
                  <span class="text-[10px] text-slate-500">${item.file_size}</span>
                </div>
                <h4 class="text-xs font-bold text-white truncate">${item.title}</h4>
                <a href="${item.download_url}" target="_blank" class="text-[10px] text-slate-400 hover:text-amber-400 truncate block mt-0.5">${item.download_url}</a>
              </div>
              <button onclick="deleteAsset(${item.id})" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white border border-red-500/30 text-xs px-3 py-1.5 rounded-lg font-bold transition shrink-0">
                Delete
              </button>
            </div>
          `;
        });

      } catch (err) {
        statusBadge.innerText = 'Connection Error 🔴';
        statusBadge.className = 'bg-red-500/10 text-red-400 border border-red-500/30 text-xs px-3 py-1 rounded-full font-mono font-bold';
        container.innerHTML = '<p class="text-xs text-red-400 text-center py-6">Error loading inventory from Supabase.</p>';
      }
    }

    async function handleAssetUpload(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Publishing...';

      const payload = {
        title: document.getElementById('assetTitle').value.trim(),
        category: document.getElementById('assetCategory').value,
        file_size: document.getElementById('assetSize').value.trim(),
        download_url: document.getElementById('assetUrl').value.trim()
      };

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/assets`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
          document.getElementById('uploadForm').reset();
          fetchAssets();
          alert('Asset Published Successfully! 🚀');
        } else {
          alert(`Database Error: ${data.message || JSON.stringify(data)}`);
        }
      } catch (err) {
        alert(`Network Error: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Publish Asset to Database 🚀';
      }
    }

    async function deleteAsset(id) {
      if (!confirm('Are you sure you want to delete this asset from the database?')) return;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/assets?id=eq.${id}`, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
          }
        });

        if (res.ok) {
          fetchAssets();
        } else {
          alert('Failed to delete asset.');
        }
      } catch (err) {
        alert('Network error while deleting.');
      }
    }

    fetchAssets();
  </script>

</body>
</html>
