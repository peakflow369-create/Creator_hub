<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-2xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center border border-amber-500/30">
          ADM
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide text-amber-400">ADMIN CONTROL PANEL</h1>
          <p class="text-xs text-slate-400">@peakflowio • Automated B2 Sync</p>
        </div>
      </div>
      <div class="flex items-center space-x-2 bg-emerald-500/10 border border-emerald-500/30 px-3 py-1.5 rounded-full">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-xs font-semibold text-emerald-400">Connected</span>
      </div>
    </div>

    <!-- Form Container -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
      <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
        <span>⚡</span> Direct File Upload to B2 & Vault Database
      </h2>

      <form id="uploadForm" onsubmit="handleDirectUpload(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 uppercase tracking-wider mb-2">Display Title</label>
          <input type="text" id="assetTitle" required placeholder="e.g. 5 Free Cinematic Whoosh Sound" 
                 class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-amber-500 transition">
        </div>

        <div>
          <label class="block text-xs text-slate-400 uppercase tracking-wider mb-2">Category</label>
          <select id="assetCategory" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-amber-500 transition">
            <option value="SFX Packs">SFX Packs</option>
            <option value="Audio Elements">Audio Elements</option>
            <option value="Video Assets">Video Assets</option>
            <option value="Presets">Presets</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 uppercase tracking-wider mb-2">Select File (Audio, SFX, Video, Zip)</label>
          <input type="file" id="fileInput" required onchange="autoDetectSize(this)" 
                 class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-amber-500/20 file:text-amber-400 hover:file:bg-amber-500/30 transition">
        </div>

        <div>
          <label class="block text-xs text-slate-400 uppercase tracking-wider mb-2">Calculated Size</label>
          <input type="text" id="assetSize" readonly placeholder="Auto-calculated" 
                 class="w-full bg-slate-950/50 border border-slate-800/80 rounded-lg px-4 py-2.5 text-sm text-slate-400 cursor-not-allowed">
        </div>

        <button type="submit" id="submitBtn" 
                class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold py-3 px-4 rounded-lg transition shadow-lg shadow-amber-500/10 active:scale-[0.99]">
          Upload File & Publish 🚀
        </button>
      </form>
    </div>

    <!-- Inventory Section -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
          <span>📦</span> Live Vault Inventory
        </h3>
        <button onclick="fetchAssets()" class="text-xs text-amber-400 hover:underline">Refresh List</button>
      </div>

      <div id="assetsList" class="space-y-2">
        <div class="text-center py-8 bg-slate-900/50 border border-slate-800/60 rounded-xl text-xs text-slate-500">
          Loading assets...
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bukpvrphgjoqrffwlwys.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FB93AZKw6tW8tVJpPlD3eA_8ygbt67J';
    const WORKER_URL = 'https://creator-hub-proxy.peakflowio-businessautomation.workers.dev';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function autoDetectSize(input) {
      if (input.files && input.files[0]) {
        const bytes = input.files[0].size;
        let formattedSize = '';
        if (bytes < 1024 * 1024) {
          formattedSize = (bytes / 1024).toFixed(1) + ' KB';
        } else {
          formattedSize = (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        document.getElementById('assetSize').value = formattedSize;
      }
    }

    async function handleDirectUpload(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file) {
        alert('File select nahi ki!');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = '1/2 Uploading to Backblaze B2... ⏳';

      try {
        const formData = new FormData();
        formData.append('file', file);

        // Upload Request to Worker
        const uploadRes = await fetch(`${WORKER_URL}/upload`, {
          method: 'POST',
          body: formData
        });

        if (!uploadRes.ok) {
          const errText = await uploadRes.text();
          throw new Error(`Worker Error (${uploadRes.status}): ${errText}`);
        }

        const uploadData = await uploadRes.json();
        if (!uploadData.success) {
          throw new Error(uploadData.error || 'Upload failed');
        }

        const uploadedFileName = uploadData.file_name;
        const uploadedFileId = uploadData.file_id || null;

        submitBtn.innerText = '2/2 Saving to Supabase Database... 🔄';

        // Insert to Supabase Database
        const payload = {
          title: document.getElementById('assetTitle').value.trim(),
          category: document.getElementById('assetCategory').value,
          file_size: document.getElementById('assetSize').value,
          file_name: uploadedFileName,
          file_id: uploadedFileId
        };

        const { error } = await supabaseClient
          .from('assets')
          .insert([payload]);

        if (error) throw error;

        alert('Success! File B2 par upload ho gayi aur Database update ho gaya! 🚀');
        document.getElementById('uploadForm').reset();
        fetchAssets();

      } catch (err) {
        console.error(err);
        alert(`Upload Error: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Upload File & Publish 🚀';
      }
    }

    async function fetchAssets() {
      const listContainer = document.getElementById('assetsList');
      try {
        const { data, error } = await supabaseClient
          .from('assets')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          listContainer.innerHTML = `
            <div class="text-center py-8 bg-slate-900/50 border border-slate-800/60 rounded-xl text-xs text-slate-500">
              No assets published yet.
            </div>`;
          return;
        }

        listContainer.innerHTML = data.map(item => `
          <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-lg flex items-center justify-between text-xs gap-2">
            <div class="overflow-hidden">
              <p class="font-medium text-slate-200 truncate">${item.title}</p>
              <p class="text-slate-500 mt-0.5">${item.category} • ${item.file_size}</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <a href="${WORKER_URL}?file=${encodeURIComponent(item.file_name)}" target="_blank" 
                 class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded transition">
                Test Stream
              </a>
              <button onclick="deleteAsset('${item.id}', '${item.file_name}', '${item.file_id || ''}')" 
                      class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded transition">
                Delete 🗑️
              </button>
            </div>
          </div>
        `).join('');

      } catch (err) {
        listContainer.innerHTML = `<div class="text-red-400 text-xs text-center py-4">Failed to load inventory: ${err.message}</div>`;
      }
    }

    async function deleteAsset(id, fileName, fileId) {
      if (!confirm(`Are you sure you want to delete "${fileName}"? This will delete it from both B2 and Database.`)) {
        return;
      }

      try {
        // 1. Worker me B2 delete request bhejo
        const deleteRes = await fetch(`${WORKER_URL}/delete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fileName: fileName,
            fileId: fileId || undefined
          })
        });

        if (!deleteRes.ok) {
          const errText = await deleteRes.text();
          console.warn(`B2 Delete Warning: ${errText}`);
        }

        // 2. Supabase DB se Delete karo
        const { error } = await supabaseClient
          .from('assets')
          .delete()
          .eq('id', id);

        if (error) throw error;

        alert('Asset successfully deleted from B2 & Supabase! 🗑️');
        fetchAssets();

      } catch (err) {
        console.error(err);
        alert(`Delete Error: ${err.message}`);
      }
    }

    // Load inventory on startup
    fetchAssets();
  </script>
</body>
</html>
