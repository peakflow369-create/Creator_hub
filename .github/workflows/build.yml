name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Expo & EAS CLI
        run: |
          npm install -g expo-cli eas-cli

      - name: Auto-generate package.json if missing
        run: |
          if [ ! -f package.json ]; then
            npm init -y
            npm install expo expo-av expo-linking react react-native
          fi

      - name: Auto-generate eas.json for Local APK Build
        run: |
          cat <<EOF > eas.json
          {
            "build": {
              "preview": {
                "android": {
                  "buildType": "apk"
                }
              }
            }
          }
          EOF

      - name: Build APK locally via EAS
        run: |
          npx eas-cli build --platform android --profile preview --local --non-interactive

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreatorHub-Native-APK
          path: '*.apk'
          
